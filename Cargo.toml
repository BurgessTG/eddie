[workspace]
resolver = "2"
members = ["crates/engine", "crates/media", "crates/core", "crates/app"]

[workspace.package]
# One version for every crate; `eddie --version` prints it.
version = "0.3.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/BurgessTG/eddie"
# The project lock uses std's file locks (1.89); image and whisper-rs-sys
# already need 1.88.
rust-version = "1.89"

# Small-disk dev profile: no debuginfo, no incremental artifacts.
[profile.dev]
debug = 0
incremental = false

# Shapes and stickers are drawn while a script's edit runs, which has a
# 250 ms budget: unoptimised, one 2160-pixel drawing took 500 ms.
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.tiny-skia-path]
opt-level = 3
[profile.dev.package.resvg]
opt-level = 3
[profile.dev.package.usvg]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
