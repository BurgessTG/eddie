[workspace]
resolver = "2"
members = ["crates/engine", "crates/media", "crates/core", "crates/app", "crates/rune-app"]
# `cargo run` starts the shipped window; the Rune window is `-p eddie-rune`.
default-members = ["crates/engine", "crates/media", "crates/core", "crates/app"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

# Small-disk dev profile: no debuginfo, no incremental artifacts.
[profile.dev]
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
