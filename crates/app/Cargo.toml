[package]
name = "openreel-app"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true
description = "Eddie's desktop window (Rune) and the eddie command"

[[bin]]
name = "eddie"
path = "src/main.rs"

[features]
# Local transcription on the GPU: whisper.cpp built with CUDA (needs the
# CUDA toolkit) or Vulkan (needs Vulkan headers and glslc). Without either,
# local transcription runs on the CPU and prefers large-v3-turbo.
cuda = ["eddie-core/cuda"]
vulkan = ["eddie-core/vulkan"]

[dependencies]
eddie-core = { path = "../core" }
openreel-engine = { path = "../engine" }
openreel-media = { path = "../media" }
rune = { git = "https://github.com/anomalyco/rune", rev = "e970367bd7d2a51e2e7d58e2978ea32eac7780cb", default-features = false, features = ["accessibility", "svg"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "e970367bd7d2a51e2e7d58e2978ea32eac7780cb" }
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
serde_json = "1"
