[package]
name = "openreel-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OpenReel desktop video editor (egui + wgpu)"

[[bin]]
name = "eddie"
path = "src/main.rs"

# Dev-only test harness (src/dev_harness.rs). The feature only enables
# extra #[cfg(test)] code that shells out to `muse exec`; it adds no
# dependencies and no code to any non-test build, release included.
[features]
dev-harness = []
# Local transcription on the GPU: whisper.cpp built with CUDA (needs the
# CUDA toolkit) or Vulkan (needs Vulkan headers and glslc). Without either,
# local transcription runs on the CPU and prefers large-v3-turbo.
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]

[dependencies]
eframe = { version = "0.32", features = ["wgpu"] }
openreel-engine = { path = "../engine" }
openreel-media = { path = "../media" }
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
rquickjs = "0.14"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
whisper-rs = "0.16"
ureq = { version = "3", features = ["multipart"] }
