[package]
name = "openreel-media"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "FFmpeg-backed probing, decoding, playback, analysis and export for Eddie"

[dependencies]
ab_glyph = "0.2"
cpal = "0.18"
ffmpeg-next = { version = "9", default-features = false, features = [
    "filter",
    "format",
    "software-scaling",
    "software-resampling",
] }
openreel-engine = { path = "../engine" }
# Shapes and stickers, drawn from SVG (Rune draws its SVG icons with it).
resvg = { version = "0.45", default-features = false }
# Graphics' files, written with fast compression (tiny-skia's own encoder
# took 40 ms a 2160-pixel drawing in release, 600 ms in debug).
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
