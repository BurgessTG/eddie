[package]
name = "openreel-media"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "FFmpeg-backed media probing, decoding, playback, and export for OpenReel"

[dependencies]
ab_glyph = "0.2"
cpal = "0.18"
ffmpeg-next = { version = "9", default-features = false, features = [
    "format",
    "software-scaling",
    "software-resampling",
] }
openreel-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
