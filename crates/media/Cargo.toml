[package]
name = "openreel-media"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "FFmpeg-backed probing, decoding, playback, analysis and export for Eddie"

[dependencies]
ab_glyph = "0.2"
cpal = "0.18"
ffmpeg-next = { version = "9", default-features = false, features = [
    "format",
    "software-scaling",
    "software-resampling",
] }
openreel-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
