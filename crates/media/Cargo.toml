[package]
name = "openreel-media"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "FFmpeg-backed media probing, decoding, playback, and export for OpenReel"

[dependencies]
ffmpeg-next = { version = "9", default-features = false, features = [
    "format",
    "software-scaling",
] }
openreel-engine = { path = "../engine" }
serde_json = "1"
